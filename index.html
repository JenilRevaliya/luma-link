<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>LumaLink — High-Speed Optical Data Transfer Protocol</title>
    <meta name="description" content="Air-gapped, camera-to-screen optical data transfer protocol transmitting compressed, encrypted images and data via dynamic color matrix modulation." />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <!-- App Navigation Header -->
    <header class="app-header">
      <div class="brand-container">
        <div class="brand-logo-glow">λ</div>
        <div>
          <h1 class="brand-title">LumaLink</h1>
        </div>
        <span class="brand-tag">OPTICAL V1.0</span>
      </div>

      <!-- Navigation Switcher -->
      <nav class="nav-tabs">
        <button class="tab-btn active" id="tab-sender" data-target="sender">
          <span>⇪</span> SENDER
        </button>
        <button class="tab-btn" id="tab-receiver" data-target="receiver">
          <span>📷</span> RECEIVER
        </button>
        <button class="tab-btn" id="tab-benchmark" data-target="benchmark">
          <span>⚡</span> LINK SIMULATOR
          <span class="tab-badge">TEST</span>
        </button>
      </nav>

      <!-- Offline Air-gap Telemetry -->
      <div class="header-telemetry">
        <div class="airgap-indicator">
          <span class="status-dot status-live"></span>
          <span>AIR-GAPPED (OFFLINE)</span>
        </div>
      </div>
    </header>

    <!-- Main Container App Mount -->
    <main class="main-content" id="app-root">
      <!-- Injected by main.ts -->
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
